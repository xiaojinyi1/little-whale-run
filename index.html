<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#062b40">
  <meta name="description" content="小鲸鱼快跑：一款可直接在浏览器中游玩的小鲸鱼版断网小恐龙游戏。跳越水面岩礁，下潜穿过悬浮礁石。">
  <title>小鲸鱼快跑 · Little Whale Run</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23062b40'/%3E%3Cpath d='M12 36c0-10 9-16 21-16 8 0 14 4 17 10l7-5v14l-7-4c-3 7-9 10-17 10-12 0-21-4-21-9z' fill='%237bc4d6'/%3E%3Ccircle cx='43' cy='30' r='2.4' fill='%23062b40'/%3E%3C/svg%3E">

<body>
  <main id="game-shell">
    <canvas id="game" tabindex="0" aria-label="小鲸鱼快跑游戏画面。空格或上方向键跳跃，下方向键下潜，P 键暂停。"></canvas>
    <button id="pause-btn" type="button" aria-label="暂停游戏" aria-pressed="false">
      <span class="bars" aria-hidden="true"><i></i><i></i></span>
